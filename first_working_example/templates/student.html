<!DOCTYPE html>
<html lang="en">
<head><title>Student</title></head>
<body>
<a href="/">Back</a>
<h1>Student</h1>

{% for subject in subjects %}
<h2>{{ subject.code }} — {{ subject.name }}</h2>
<table border="1">
    <tr>{% for week in range(1, 14) %}<th>Week {{ week }}</th>{% endfor %}</tr>
    <tr>{% for week in range(1, 14) %}
        <td>{{ grids[subject.subject_id].get((student_id, week), '') }}</td>
    {% endfor %}</tr>
</table>
{% endfor %}

<h2>Scan attendance QR</h2>
<video id="camera" width="280" height="210" playsinline muted></video>
<br>
<button id="start">Start camera</button>
<button id="stop">Stop camera</button>
<p id="message" data-scan-url="{{ url_for('scan', student_id=student_id) }}"></p>

<script type="module" src="{{ url_for('static', filename='JS/student.js') }}"></script>
</body>
</html>
