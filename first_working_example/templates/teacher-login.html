<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login | GeoAttend</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='CSS/style.css') }}">
</head>

<body class="student-login-body teacher-login-body">
    <main class="student-login-page">
        <h1 class="page-title">Teacher Login</h1>

        <section class="account-login-card">
            <header class="account-login-header">
                GeoAttend
            </header>

            <form class="account-login-form"
                  action="{{ url_for('teacher_login_submit') }}"
                  method="POST">

                <input type="hidden"
                       name="teacher_id"
                       value="{{ teacher_id }}">

                <div class="form-group">
                    <label for="teacherEmail">Email</label>
                    <input class="form-control"
                           type="email"
                           id="teacherEmail"
                           name="email"
                           placeholder="Enter your teacher email"
                           autocomplete="email"
                           required>
                </div>

                <div class="form-group">
                    <label for="teacherPassword">Password</label>
                    <input class="form-control"
                           type="password"
                           id="teacherPassword"
                           name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>
                </div>

                <button class="account-login-button teacher-login-button"
                        type="submit">
                    Login
                </button>

                <p class="portal-label teacher-portal-label">
                    Teacher Portal
                </p>
            </form>
        </section>

        <a class="switch-portal-button student-login-back-button"
           href="{{ url_for('select_user_page') }}">
            Back to portal selection
        </a>
    </main>
</body>
</html>
