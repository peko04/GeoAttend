<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | GeoAttend</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='CSS/style.css') }}"
    >
</head>

<body class="student-login-body">

    <main class="student-login-page">

        <h1 class="page-title">Student Login</h1>

        <section class="account-login-card">
            <header class="account-login-header">
                GeoAttend
            </header>

            <form
                class="account-login-form"
                action="{{ url_for('student_login_submit') }}"
                method="POST"
            >
                <input
                    type="hidden"
                    name="student_id"
                    value="{{ student_id }}"
                >

                <div class="form-group">
                    <label for="studentEmail">Email</label>
                    <input
                        class="form-control"
                        type="email"
                        id="studentEmail"
                        name="email"
                        placeholder="Enter your student email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentPassword">Password</label>
                    <input
                        class="form-control"
                        type="password"
                        id="studentPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    class="account-login-button student-login-button"
                    type="submit"
                >
                    Login
                </button>

                <p class="portal-label student-portal-label">
                    Student Portal
                </p>
            </form>
        </section>

        <a
            class="switch-portal-button student-login-back-button"
            href="{{ url_for('select_user_page') }}"
        >
            Back to portal selection
        </a>

    </main>

</body>
</html>
