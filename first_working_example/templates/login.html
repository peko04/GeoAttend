<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GeoAttend Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='CSS/style.css') }}"
    >
</head>

<body class="login-body">

    <main class="login-wrapper">

        <header class="login-brand">

            <h1>GeoAttend</h1>

            <p>
                Smart and simple university attendance
            </p>

        </header>


        <section class="login-card">

            <!-- Left information section -->
            <div class="login-information">

                <h2>
                    Welcome to GeoAttend
                </h2>

                <p>
                    Select your account to view attendance,
                    scan a classroom QR code, or start a new
                    attendance session.
                </p>

            </div>


            <!-- Right selection section -->
            <div class="login-form-area">

                <h2>
                    Select your portal
                </h2>

                <p class="login-subtitle">
                    Choose a student or teacher account.
                </p>


                <!-- Student selection -->
                <form
                    action="{{ url_for('select_student') }}"
                    method="POST"
                >

                    <div class="form-group">

                        <label for="studentId">
                            Student
                        </label>

                        <select
                            class="form-control"
                            id="studentId"
                            name="student_id"
                            required
                        >

                            {% for student in students %}

                                <option
                                    value="{{ student['student_id'] }}"
                                >
                                    {{ student['full_name'] }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <button
                        class="login-button"
                        type="submit"
                    >
                        Enter Student Portal
                    </button>

                </form>


                <div
                    style="
                        margin: 28px 0;
                        border-top: 1px solid #dce3eb;
                    "
                ></div>


                <!-- Teacher selection -->
                <form
                    action="{{ url_for('select_teacher') }}"
                    method="POST"
                >

                    <div class="form-group">

                        <label for="teacherId">
                            Teacher
                        </label>

                        <select
                            class="form-control"
                            id="teacherId"
                            name="lecturer_id"
                            required
                        >

                            {% for lecturer in lecturers %}

                                <option
                                    value="{{ lecturer['lecturer_id'] }}"
                                >
                                    {{ lecturer['full_name'] }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <button
                        class="login-button teacher-button"
                        type="submit"
                    >
                        Enter Teacher Portal
                    </button>

                </form>

            </div>

        </section>

    </main>

</body>

</html>
