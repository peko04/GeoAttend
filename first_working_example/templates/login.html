
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GeoAttend Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='CSS/style.css') }}"
    >
</head>

<body class="login-body">

    <main class="login-wrapper">

        <header class="login-brand">

            <h1>GeoAttend</h1>

            <p>
                Smart and simple university attendance
            </p>

        </header>


        <section class="login-card">

            <!-- Left information section -->
            <div class="login-information">

                <h2>
                    Welcome to GeoAttend
                </h2>

                <p>
                    Log in to view attendance,
                    scan a classroom QR code, or start a new
                    attendance session.
                </p>

            </div>


            <!-- Right login section -->
            <div class="login-form-area">

                <h2>
                    Login
                </h2>

                <p class="login-subtitle">
                    Enter your email and password.
                </p>

                {% if error %}
                    <p class="error">{{ error }}</p>
                {% endif %}

                <form
                    action="{{ url_for('login') }}"
                    method="POST"
                >

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            class="form-control"
                            type="email"
                            id="email"
                            name="email"
                            required
                            autocomplete="email"
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            class="form-control"
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="current-password"
                        >

                    </div>


                    <button
                        class="login-button"
                        type="submit"
                    >
                        Login
                    </button>

                </form>

            </div>

        </section>

    </main>

</body>

</html>
