<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeoAttend Student Login</title>
    <link rel="stylesheet" href="geoattend.css">
</head>

<body class="login-body">

    <main class="login-page">
        <h1 class="page-title">Student Login</h1>

        <section class="login-card">
            <header class="login-header">GeoAttend</header>

            <form class="login-form" action="./dashboard.html">
                <div class="form-row">
                    <label for="studentEmail">Email</label>

                    <input type="email" id="studentEmail" required>
                </div>

                <div class="form-row">
                    <label for="studentPassword">Password</label>

                    <input type="password" id="studentPassword" minlength="4" required>
                </div>

                <button class="main-button student-button" type="submit">
                    Login
                </button>

                <p class="portal-name student-text">Student Portal</p>
            </form>
        </section>

        <div class="switch-portal">
            <p>Are you a teacher?</p>

            <a class="teacher-portal-button" href="./teacher-login.html">
                Teacher Portal
            </a>
        </div>
    </main>

</body>

</html>
